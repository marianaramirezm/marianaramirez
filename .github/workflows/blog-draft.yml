name: Blog draft

on:
  schedule:
    # 11:00 and 12:00 UTC cover 07:00 America/New_York in daylight and standard time.
    # The script exits unless the New York hour is 07.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when today's review branch already exists
        id: existing
        run: |
          set -euo pipefail
          date=$(TZ=America/New_York date +%F)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "blog-draft-${date}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "blog-draft-${date} already exists. Not opening another pull request."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Write the draft
        if: steps.existing.outputs.exists != 'true'
        id: draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/blog-draft.mjs

      - name: Open a review pull request
        if: steps.existing.outputs.exists != 'true' && steps.draft.outputs.status == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.draft.outputs.date }}
          SLUG: ${{ steps.draft.outputs.slug }}
        run: |
          set -euo pipefail
          branch="blog-draft-${DATE}"
          if [ "$branch" = "main" ] || [ -z "$DATE" ]; then
            echo "Refusing to publish on main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/blog
          if [ -d src/assets/blog ]; then
            git add src/assets/blog
          fi
          git commit -m "Blog draft: ${DATE}"
          git push origin "$branch"
          cat > /tmp/pr-body.md <<EOF
          Draft for Mariana to review. This pull request does not merge itself.

          - English: \`/blog/${SLUG}/\`
          - Spanish: \`/es/blog/${SLUG}/\`
          - The posts are \`draft: true\`, so they stay off the production site until that flag is changed.
          - Every cited URL was in the RSS items fetched for this run.

          Do not merge until the copy is approved.
          EOF
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Blog draft: ${DATE}" \
            --body-file /tmp/pr-body.md
